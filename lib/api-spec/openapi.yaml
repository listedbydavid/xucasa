openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: notifications
    description: Notification preferences and push devices
  - name: saved-properties
    description: Saved-property alert settings
  - name: agent-relationships
    description: Agent contact resolution, listing sharing, and buyer-agent linking
  - name: agent-directory
    description: Verified-agent directory and public profile management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered and signed in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
  /saved-properties/{propertyId}/price-drop-alert:
    patch:
      operationId: updateSavedPropertyPriceDropAlert
      tags: [saved-properties]
      summary: Opt a saved property into or out of price-drop alerts
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceDropAlertUpdate"
      responses:
        "200":
          description: Updated saved property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPropertyAlert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [notifications]
      summary: Get the current user's notification preferences
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateNotificationPreferences
      tags: [notifications]
      summary: Update the current user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register an Expo push token for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegistration"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean
                    const: true
                required: [registered]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /push-tokens/{token}:
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Unregister an Expo push token for the current user
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token unregistered
        "400":
          $ref: "#/components/responses/BadRequest"
  /properties/{id}/contact-agent:
    get:
      operationId: getContactAgent
      tags: [agent-relationships]
      summary: Get the agent contact card for a property
      description: Public. Returns the appropriate agent (buyer's agent, listing agent, or platform agent) for a property detail view.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Agent contact info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /properties/{id}/tour-inquiry:
    post:
      operationId: createTourInquiry
      tags: [agent-relationships]
      summary: Submit a tour inquiry for a property
      description: Public. Creates a sell_lead and notifies the displayed agent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourInquiryInput"
      responses:
        "200":
          description: Inquiry submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required: [success, message]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /properties/{id}/photos:
    post:
      operationId: uploadListingPhotos
      tags: [agent-listings]
      summary: Upload listing photos
      description: Owner-only. Accepts up to 20 JPG, PNG, WEBP, HEIC, or HEIF images, with a 10 MB limit per image.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ListingPhotoUploadInput"
      responses:
        "201":
          description: Photos uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeListingPhoto
      tags: [agent-listings]
      summary: Remove a listing photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveListingPhotoInput"
      responses:
        "200":
          description: Photo removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingPhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /properties/{id}/view:
    post:
      operationId: trackPropertyView
      tags: [agent-listings]
      summary: Track a public property view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyViewInput"
      responses:
        "200":
          description: View processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracked:
                    type: boolean
                  reason:
                    type: string
                required: [tracked]
        "404":
          $ref: "#/components/responses/NotFound"
  /properties/{id}/inquiry:
    post:
      operationId: createPropertyInquiry
      tags: [agent-listings]
      summary: Submit a public listing inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInquiryInput"
      responses:
        "201":
          description: Inquiry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Inquiry rate limit exceeded
  /properties/{id}/archive:
    post:
      operationId: archiveAgentListing
      tags: [agent-listings]
      summary: Soft archive an owned listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveListingInput"
      responses:
        "200":
          description: Archived property
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /agent/listing-analytics/{id}:
    get:
      operationId: getListingAnalytics
      tags: [agent-listings]
      summary: Get analytics for an owned listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Listing analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/search:
    get:
      operationId: searchAgents
      tags: [agent-relationships]
      summary: Search verified agents
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching verified agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAgent"
                required: [agents]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agents/directory:
    get:
      operationId: getAgentDirectory
      tags: [agent-directory]
      summary: Search the verified-agent directory
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: number } }
        - { name: offset, in: query, schema: { type: number } }
      responses:
        "200":
          description: Directory page
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentDirectoryResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Verified agent access required }
  /agents/{agentId}/profile:
    get:
      operationId: getAgentProfile
      tags: [agent-directory]
      summary: Get a verified agent's public profile
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Agent public profile
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Verified agent access required }
        "404": { $ref: "#/components/responses/NotFound" }
  /agent/public-profile:
    get:
      operationId: getOwnAgentPublicProfile
      tags: [agent-directory]
      summary: Get the authenticated agent's editable public profile
      responses:
        "200":
          description: Editable profile
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnAgentPublicProfile" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Agent access required }
    patch:
      operationId: updateOwnAgentPublicProfile
      tags: [agent-directory]
      summary: Update public-profile corrections and visibility
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentPublicProfileUpdate" } } }
      responses:
        "200":
          description: Updated profile
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnAgentPublicProfile" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Verified agent access required }
  /agent/public-profile/sync-mls:
    post:
      operationId: syncOwnAgentPublicProfileFromMls
      tags: [agent-directory]
      summary: Refresh MLS snapshot fields without changing overrides
      responses:
        "200":
          description: Synced profile
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnAgentPublicProfile" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Verified agent access required }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: MLS sync unavailable }
  /buyer/link-agent:
    post:
      operationId: linkAgent
      tags: [agent-relationships]
      summary: Link a verified agent as the buyer's agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAgentInput"
      responses:
        "200":
          description: Agent linked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agent:
                    $ref: "#/components/schemas/PublicAgent"
                required: [success, agent]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Buyer already has a real agent linked
  /buyer/my-agent:
    get:
      operationId: getMyAgent
      tags: [agent-relationships]
      summary: Get the buyer's assigned agent
      responses:
        "200":
          description: Assigned agent or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    oneOf:
                      - $ref: "#/components/schemas/PublicAgent"
                      - type: "null"
                required: [agent]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agent/send-listing:
    post:
      operationId: sendListing
      tags: [agent-relationships]
      summary: Agent sends a listing to a linked client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendListingInput"
      responses:
        "200":
          description: Listing sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required: [success, message]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a verified agent or client not linked
        "404":
          $ref: "#/components/responses/NotFound"
  /agent/listing-share-url/{propertyId}:
    get:
      operationId: getListingShareUrl
      tags: [agent-relationships]
      summary: Get a shareable URL for a listing
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shareable URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl:
                    type: string
                required: [shareUrl]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a verified agent or not the listing owner
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Trusted public frontend origin is not configured
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required: [email, password]
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 10
        firstName:
          type: string
        lastName:
          type: string
      required: [email, password, firstName]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        onboardingCompleted:
          type: [boolean, "null"]
        currentMode:
          type: [string, "null"]
        primaryIntent:
          type: [string, "null"]
      required: [id, email]
    AuthSession:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/AuthUser"
        sessionToken:
          type: string
          description: Native-only bearer session credential; omitted from browser responses.
      required: [ok, user]
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    PriceDropAlertUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    SavedPropertyAlert:
      type: object
      properties:
        id:
          type: number
        propertyId:
          type: number
        priceDropAlerts:
          type: boolean
      required: [id, propertyId, priceDropAlerts]
    NotificationPreferences:
      type: object
      properties:
        pushEnabled:
          type: boolean
        pushPriceDrop:
          type: boolean
      required: [pushEnabled, pushPriceDrop]
    NotificationPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        pushEnabled:
          type: boolean
        pushPriceDrop:
          type: boolean
    PushTokenRegistration:
      type: object
      properties:
        token:
          type: string
          pattern: '^(ExponentPushToken|ExpoPushToken)\[.+\]$'
        platform:
          type: string
          enum: [ios, android]
      required: [token]
    PublicAgent:
      type: object
      properties:
        id:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        brokerageName:
          type: ["string", "null"]
        agentMlsId:
          type: ["string", "null"]
      required: [id, firstName, lastName, email, phone, profileImageUrl, brokerageName, agentMlsId]
    AgentPropertySummary:
      type: object
      properties:
        id: { type: number }
        title: { type: string }
        location: { type: string }
        addressCity: { type: [string, "null"] }
        addressState: { type: [string, "null"] }
        price: { type: number }
        closePrice: { type: [number, "null"] }
        listDate: { type: [string, "null"], format: date-time }
        closeDate: { type: [string, "null"], format: date-time }
        beds: { type: number }
        baths: { type: number }
        sqft: { type: number }
        imageUrl: { type: [string, "null"] }
        listingStatus: { type: string }
        status: { type: string }
        source: { type: string }
        mlsNumber: { type: [string, "null"] }
      required: [id, title, location, price, beds, baths, sqft, listingStatus, status, source]
    AgentDirectoryItem:
      type: object
      properties:
        id: { type: string }
        displayName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
        brokerageName: { type: [string, "null"] }
        licenseNumber: { type: [string, "null"] }
        licenseState: { type: [string, "null"] }
        currentListingsCount: { type: number }
        salesYtdCount: { type: number }
        salesPreviousYearCount: { type: number }
        salesFiveYearsCount: { type: number }
        lastMlsSyncAt: { type: [string, "null"], format: date-time }
      required: [id, currentListingsCount, salesYtdCount, salesPreviousYearCount, salesFiveYearsCount]
    AgentDirectoryResponse:
      type: object
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/AgentDirectoryItem" } }
        total: { type: number }
        limit: { type: number }
        offset: { type: number }
      required: [agents, total, limit, offset]
    AgentProfile:
      allOf:
        - $ref: "#/components/schemas/AgentDirectoryItem"
        - type: object
          properties:
            email: { type: [string, "null"] }
            phone: { type: [string, "null"] }
            website: { type: [string, "null"] }
            brokerageAddress: { type: [string, "null"] }
            brokerageWebsite: { type: [string, "null"] }
            brokerageLicense: { type: [string, "null"] }
            bio: { type: [string, "null"] }
            sourceFields: { type: object, additionalProperties: { type: string, enum: [mls, override, account] } }
            periods: { type: object, properties: { currentYear: { type: number }, previousYear: { type: number }, fiveYearStart: { type: number } }, required: [currentYear, previousYear, fiveYearStart] }
            currentListings: { type: array, items: { $ref: "#/components/schemas/AgentPropertySummary" } }
            salesYtd: { type: array, items: { $ref: "#/components/schemas/AgentPropertySummary" } }
            salesPreviousYear: { type: array, items: { $ref: "#/components/schemas/AgentPropertySummary" } }
            salesFiveYears: { type: array, items: { $ref: "#/components/schemas/AgentPropertySummary" } }
          required: [periods, currentListings, salesYtd, salesPreviousYear, salesFiveYears]
    AgentPublicProfileUpdate:
      type: object
      minProperties: 1
      properties:
        bio: { type: [string, "null"], maxLength: 4000 }
        displayNameOverride: { type: [string, "null"], maxLength: 200 }
        emailOverride: { type: [string, "null"], pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        phoneOverride: { type: [string, "null"], maxLength: 50 }
        websiteOverride: { type: [string, "null"], pattern: '^https?://' }
        profileImageUrlOverride: { type: [string, "null"], pattern: '^https?://' }
        brokerageNameOverride: { type: [string, "null"], maxLength: 200 }
        brokerageAddressOverride: { type: [string, "null"], maxLength: 500 }
        brokerageWebsiteOverride: { type: [string, "null"], pattern: '^https?://' }
        licenseOverride: { type: [string, "null"], maxLength: 100 }
        brokerageLicenseOverride: { type: [string, "null"], maxLength: 100 }
        showEmail: { type: boolean }
        showPhone: { type: boolean }
        showWebsite: { type: boolean }
        showLicense: { type: boolean }
        showBrokerageName: { type: boolean }
        showBrokerageAddress: { type: boolean }
        showBrokerageWebsite: { type: boolean }
        showBrokerageLicense: { type: boolean }
    OwnAgentPublicProfile:
      type: object
      properties:
        userId: { type: string }
        bio: { type: [string, "null"] }
        displayNameOverride: { type: [string, "null"] }
        emailOverride: { type: [string, "null"] }
        phoneOverride: { type: [string, "null"] }
        websiteOverride: { type: [string, "null"] }
        profileImageUrlOverride: { type: [string, "null"] }
        brokerageNameOverride: { type: [string, "null"] }
        brokerageAddressOverride: { type: [string, "null"] }
        brokerageWebsiteOverride: { type: [string, "null"] }
        brokerageLicenseOverride: { type: [string, "null"] }
        licenseOverride: { type: [string, "null"] }
        mlsDisplayName: { type: [string, "null"] }
        mlsEmail: { type: [string, "null"] }
        mlsPhone: { type: [string, "null"] }
        mlsWebsite: { type: [string, "null"] }
        mlsProfileImageUrl: { type: [string, "null"] }
        mlsBrokerageName: { type: [string, "null"] }
